<!doctype html>
<html lang="cs" data-theme="light"><head>
<meta name="cermat-edition" content="student">
<meta name="cermat-release" content="aa9902d3f79f13b0">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Procvičování matematiky k přijímacím zkouškám. Oficiální úlohy CERMAT a procvičování podle témat.">
<meta name="theme-color" content="#f8f7f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cermat">

<title>Cermat testy – procvičování matematiky</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<style>
/* Shared settings and worksheet controls. */
:root { --hl:var(--ac); font-size:16px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(100px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--tx); font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) var(--page-pad) calc(48px + env(safe-area-inset-bottom, 0px)); }
main.homev { max-width: 1160px; padding-top: env(safe-area-inset-top, 0px); }
#app:not(.paperview) { min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { font-size: 1.875rem; font-weight: 650; line-height: 1.25; letter-spacing: -.035em; margin: 0 0 24px; }
h2 { font-size: 1.125rem; font-weight: 600; line-height: 1.45; letter-spacing: -.015em; margin: 0 0 8px; }
h3 { font-weight: 600; }
p { margin: 0 0 16px; }
a { color: var(--ac); text-underline-offset: 3px; }
button, input, textarea, select, summary { font: inherit; }
button { min-height: 42px; padding: 8px 16px; border: 1px solid var(--bd); border-radius: 6px; background: var(--card); color: var(--tx); font-size: .875rem; font-weight: 600; line-height: 1.4; cursor: pointer; }
button:hover:not(:disabled) { background: var(--surface); border-color: var(--mut); }
button:active:not(:disabled) { background: var(--sel); }
button.p { color: var(--onac); background: var(--ac); border-color: var(--ac); }
button.p:hover:not(:disabled) { background: color-mix(in srgb, var(--ac) 88%, var(--tx)); border-color: transparent; }
button.d { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; }
input[type="text"], input[type="number"], input[type="password"], input[type="search"], textarea, select {
  width: 100%; min-width: 0; min-height: 44px; padding: 9px 12px;
  border: 1px solid var(--bd); border-radius: 6px; background: var(--field); color: var(--tx); font-size: 1rem;
}
input::placeholder, textarea::placeholder { color: var(--mut); opacity: 1; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 1px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--ac); width: 18px; height: 18px; flex: none; }
textarea { display: block; min-height: 96px; line-height: 1.6; resize: vertical; }
label { display: block; margin: 16px 0 6px; color: var(--mut); font-size: .875rem; font-weight: 500; }
.card { margin: 0 0 16px; padding: 22px 24px; background: var(--card); border: 1px solid var(--bd); border-radius: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > *, .tc-h { min-width: 0; }
.sp { justify-content: space-between; }
.mut { color: var(--mut); font-size: .875rem; line-height: 1.6; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.opt { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.opt input[type="text"] { flex: 1; }
.opt select { width: auto; }
.hintbox { margin-top: 12px; padding: 12px 14px; background: var(--sel); color: var(--tx); border: 1px solid var(--bd); border-left: 3px solid var(--ac); border-radius: 4px; font-size: .875rem; }
.big { font-size: 3rem; font-weight: 650; line-height: 1.2; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.ch { display: flex; gap: 10px; align-items: flex-start; padding: 12px; margin: 8px 0; border: 1px solid var(--bd); border-radius: 6px; color: var(--tx); font-size: 1rem; background: var(--card); }
.ch:has(input:checked) { background: var(--sel); border-color: var(--ac); }
.ch.tf { justify-content: space-between; align-items: center; }
.ch.tf .row { flex-wrap: nowrap; }
.ch input { margin-top: 4px; }
.padbar button.on { background: var(--sel); color: var(--ac); border-color: var(--ac); }
.deco { display: none; }

/* Navigation and the existing test library. */
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; margin: 0 0 30px; background: var(--bg); border-bottom: 1px solid var(--bd); }
.tn-in { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 80px; padding: 16px 0; }
.brand { display: flex; gap: 11px; align-items: center; flex: none; }
.topnav .logo { display: grid; place-items: center; width: 36px; height: 40px; border-radius: 6px; color: var(--ac); background: var(--sel); flex: none; }
.topnav .logo svg { width: 22px; height: 22px; }
.bt b { display: block; font-size: 1.0625rem; font-weight: 650; line-height: 1.35; letter-spacing: -.025em; }
.bt span { display: block; color: var(--mut); font-size: .75rem; line-height: 1.5; margin-top: 1px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav > button, .dd summary { min-height: 40px; display: flex; gap: 6px; align-items: center; padding: 8px 11px; background: transparent; border: 0; color: var(--mut); font-size: .8125rem; font-weight: 550; border-radius: 4px; white-space: nowrap; cursor: pointer; list-style: none; }
.nav > button:hover:not(:disabled), .dd summary:hover { background: var(--surface); color: var(--tx); border-color: transparent; }
.nav > button.on { color: var(--ac); background: var(--sel); font-weight: 650; }
.nav .si { padding: 8px; }
.nav .mi { display: none; }
.dd { position: relative; }
.dd summary::-webkit-details-marker { display: none; }
.dd summary::after { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin: -3px 2px 0 3px; }
.dd[open] summary { color: var(--ac); background: var(--sel); }
.dd .menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; display: grid; gap: 2px; min-width: 190px; padding: 5px; background: var(--card); border: 1px solid var(--bd); border-radius: 6px; box-shadow: 0 6px 18px var(--sh); }
.dd .menu button { border: 0; background: transparent; text-align: left; font-size: .875rem; font-weight: 500; padding: 10px; }
.dd .menu button:hover:not(:disabled) { background: var(--surface); }
.sbar { padding: 0 0 16px; }
.sbar input { background: var(--card); }
.pagehead { margin: 0 0 24px; }
.pagehead h1 { margin: 0 0 6px; }
.pagehead p { margin: 0; color: var(--mut); font-size: .9375rem; }
.homev > .row:empty { display: none; }
.homev > .row:not(:empty) { margin-bottom: 16px; }
#ov, #sect-tests { scroll-margin-top: 108px; }
.ov { display: grid; grid-template-columns: 280px minmax(0, 1fr); align-items: center; gap: 24px; padding: 20px 24px; margin-bottom: 0; }
.ovrow { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-right: 24px; border-right: 1px solid var(--bd); }
.ovrow b { display: block; font-size: 1.75rem; font-weight: 600; letter-spacing: -.04em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ovrow span { display: block; color: var(--mut); font-size: .75rem; margin-top: 5px; }
.ov-detail { min-width: 0; }
.ov-label { color: var(--mut); font-size: .75rem; font-weight: 600; margin-bottom: 8px; }
.goal { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; margin: 0 0 10px; }
.goal i { display: block; height: 100%; background: var(--ac); }
.ov-detail > .mut { font-size: .8125rem; margin: 0 !important; }
.tps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; grid-column: 1 / -1; padding-top: 20px; border-top: 1px solid var(--bd); }
.tp { display: grid; grid-template-columns: minmax(95px, 44%) minmax(20px, 1fr) 40px; align-items: center; gap: 12px; font-size: .8125rem; }
.tp .bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
.tp .bar i { display: block; height: 100%; background: var(--ac); }
.tp b { font-size: .75rem; font-weight: 600; text-align: right; color: var(--mut); font-variant-numeric: tabular-nums; }
.ov > button { grid-column: 1 / -1; justify-self: start; }
.sech { display: flex; gap: 16px; justify-content: space-between; align-items: baseline; margin: 30px 0 16px; }
.sech h2 { margin: 0; font-size: 1.125rem; letter-spacing: -.015em; }
.sech > span { color: var(--mut); font-size: .8125rem; }
.tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tc { display: flex; flex-direction: column; gap: 16px; min-width: 0; padding: 22px; background: var(--card); border: 1px solid var(--bd); border-radius: 8px; }
.tc:hover { border-color: color-mix(in srgb, var(--mut) 55%, var(--bd)); }
.tc-top { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
.tc h3 { margin: 0; font-size: 1.0625rem; line-height: 1.5; letter-spacing: -.02em; }
.tc-sub { display: block; margin-top: 4px; color: var(--mut); font-size: .8125rem; line-height: 1.5; }
.ring { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; flex: none; min-width: 54px; padding-left: 12px; border-left: 1px solid var(--bd); }
.ring::before { content: "Nejlepší"; color: var(--mut); font-size: .625rem; font-weight: 500; line-height: 1.5; }
.ring span { color: var(--tx); font-size: 1.125rem; font-weight: 600; line-height: 1.5; font-variant-numeric: tabular-nums; }
.tc.good .ring span { color: var(--ok); }
.tc.mid .ring span { color: var(--ac); }
.tc-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; color: var(--mut); font-size: .75rem; line-height: 1.5; }
.tc-tags span { white-space: nowrap; }
.tc-tags .own, .tc-tags .acc { padding: 2px 6px; border: 1px solid var(--bd); border-radius: 3px; font-size: .6875rem; color: var(--mut); }
.tc-last { color: var(--mut); font-size: .75rem; line-height: 1.5; }
.tc-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 2px; }
.tc-act button { display: inline-flex; gap: 7px; align-items: center; justify-content: center; min-height: 40px; font-size: .8125rem; }
.tc-act .p { flex: 1; color: var(--ac); background: var(--card); border-color: var(--bd); }
.tc-act .p:hover:not(:disabled) { color: var(--ac); background: var(--sel); border-color: var(--ac); }
.tc-act svg { width: 13px; height: 13px; flex: none; }
.tc-adm { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--bd); }
.tc-adm button { min-height: 36px; padding: 6px 10px; font-size: .75rem; }
.tc.mix { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 28px; grid-column: 1 / -1; padding: 20px 22px; background: var(--sel); }
.mix .tc-top { grid-column: 1; justify-content: flex-start; align-items: center; gap: 12px; }
.mix .tc-h { order: 1; }
.mixic { width: 24px; height: 24px; display: grid; place-items: center; flex: none; color: var(--ac); }
.mixic svg { width: 22px; height: 22px; }
.mix .tc-sub { margin-top: 2px; }
.mix .tc-tags { grid-column: 1; margin-left: 36px; }
.mix .tc-last { grid-column: 1; margin-left: 36px; }
.mix .tc-act { grid-column: 2; grid-row: 1 / span 3; align-self: center; margin: 0; padding: 0; flex-wrap: nowrap; }
.mix .tc-act .p { flex: none; color: var(--onac); background: var(--ac); border-color: var(--ac); }
.mix .tc-act .p:hover:not(:disabled) { background: color-mix(in srgb, var(--ac) 88%, var(--tx)); }
.mix .tc-act button:not(.p) { min-width: 40px; padding: 8px; background: transparent; border-color: color-mix(in srgb, var(--ac) 25%, var(--bd)); }
.sect, .sgrp { margin: 24px 0 10px; color: var(--mut); font-size: .75rem; font-weight: 600; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 24px 0 0; margin-top: 32px; border-top: 1px solid var(--bd); }
.foot button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 4px 0; color: var(--mut); background: transparent; border-color: transparent; font-size: .75rem; font-weight: 500; }
.foot button svg { width: 14px; height: 14px; }
.foot button:hover:not(:disabled) { color: var(--tx); background: transparent; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }

/* Settings, import, editor, and result screens. */
.sethd { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
.sethd h1 { margin: 0; }
.sethd button { padding: 8px 12px; font-weight: 500; }
.sgrp { font-size: .8125rem; color: var(--tx); }
.card:has(> .srow) { padding-top: 4px; padding-bottom: 4px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 24px; padding: 20px 0; border-top: 1px solid var(--bd); }
.srow:first-child { border-top: 0; }
.srow b { display: block; font-size: .875rem; font-weight: 600; }
.srow span { display: block; margin-top: 4px; color: var(--mut); font-size: .8125rem; line-height: 1.55; }
.srow > div:only-child { grid-column: 1 / -1; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.seg button { flex: 1 1 auto; min-height: 40px; padding: 8px 10px; font-size: .75rem; font-weight: 500; }
.seg button.on { border-color: var(--ac); background: var(--sel); color: var(--ac); font-weight: 600; }
.srow:has(.seg button:only-child) .seg button { flex: none; min-width: 122px; }
.steps { margin: 8px 0 18px; padding-left: 22px; color: var(--mut); font-size: .875rem; }
.steps li { margin: 4px 0; padding-left: 3px; }
#bk, #sk { padding: 14px; background: var(--bg); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: .875rem; }
.card:has(> .big) { padding: 24px; border-left: 3px solid var(--ac); }
.card:has(> .big) .mut { margin-top: 6px; }

/* The test remains a continuous worksheet, with quiet controls around it. */
main.paperview { max-width: 936px; padding-top: env(safe-area-inset-top, 0px); }
.topbar { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; padding: 14px 0; margin-bottom: 12px; border-bottom: 1px solid var(--bd); background: var(--bg); }
.topbar button { white-space: nowrap; }
#timer { padding: 0; font-size: .875rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.paper { max-width: 880px; margin: 0 auto; padding: 32px 40px; color: var(--tx); background: var(--card); border: 1px solid var(--bd); border-radius: 8px; }
.phead { padding-bottom: 22px; margin-bottom: 0; border-bottom: 1px solid var(--bd); }
.pt1 { margin: 0; font-size: 1.5rem; font-weight: 650; line-height: 1.35; letter-spacing: -.025em; }
.pmeta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; color: var(--mut); font-size: .8125rem; }
.pins { max-width: 78ch; margin: 16px 0 0; color: var(--mut); font-size: .8125rem; line-height: 1.65; }
.pq { padding: 24px 0; border-bottom: 1px solid var(--bd); }
.pq:last-of-type { border-bottom: 0; }
.pqh { display: flex; gap: 14px; align-items: baseline; }
.pn { display: inline-grid; place-items: center; flex: none; min-width: 32px; height: 30px; padding: 0 6px; color: var(--ac); background: var(--sel); border: 1px solid transparent; border-radius: 4px; font-size: .8125rem; font-weight: 600; white-space: nowrap; text-align: center; }
.pqt { flex: 1; min-width: 0; margin: 0; font-size: 1rem; font-weight: 500; line-height: 1.65; letter-spacing: 0; overflow-wrap: anywhere; }
.pp { flex: none; color: var(--mut); font-size: .75rem; white-space: nowrap; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 0 46px; }
.opts.row { flex-direction: row; flex-wrap: wrap; gap: 8px; }
.po { position: relative; display: flex; gap: 12px; align-items: center; min-height: 46px; margin: 0; padding: 10px 12px; background: var(--field); border: 1px solid var(--bd); border-radius: 6px; color: var(--tx); font-size: .9375rem; font-weight: 400; cursor: pointer; }
.po:hover { background: var(--surface); }
.po input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.bub { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border: 1px solid var(--bd); border-radius: 4px; color: var(--mut); background: var(--card); font-size: .75rem; font-weight: 600; }
.po:has(input:checked) { background: var(--sel); border-color: var(--ac); }
.po input:checked + .bub { background: var(--ac); border-color: var(--ac); color: var(--onac); }
.po:has(input:focus-visible) { outline: 2px solid var(--ac); outline-offset: 3px; }
.opts.row .po { padding: 8px; }
.tfp { border-collapse: collapse; table-layout: fixed; width: calc(100% - 46px); margin: 16px 0 0 46px; font-size: .9375rem; }
.tfp th { width: 58px; padding: 6px 0 8px; color: var(--mut); font-size: .6875rem; font-weight: 600; text-align: center; }
.tfp th:first-child { width: auto; }
.tfp td { padding: 12px 8px; border-top: 1px solid var(--bd); vertical-align: middle; overflow-wrap: anywhere; }
.tfp td:first-child { padding-left: 0; }
.tfp td:not(:first-child) { text-align: center; }
input.sq { appearance: none; -webkit-appearance: none; display: inline-grid; place-items: center; width: 30px; height: 30px; margin: 4px; border: 1px solid var(--mut); border-radius: 4px; background: var(--field); vertical-align: middle; cursor: pointer; }
input.sq:hover { border-color: var(--ac); background: var(--sel); }
input.sq:checked { color: var(--onac); background: var(--ac); border-color: var(--ac); }
input.sq:checked::after { content: "¹3"; font-size: 1rem; font-weight: 700; line-height: 1; }
.ansb { display: flex; gap: 16px; align-items: center; margin: 16px 0 0 46px; color: var(--mut); font-size: .8125rem; }
.ansb input[type="text"] { width: min(240px, 100%); height: 44px; font-size: 1rem; }
.hb { display: inline-flex; align-items: center; margin: 12px 0 0 46px; padding: 8px 10px; min-height: 40px; border-color: transparent; color: var(--mut); background: transparent; font-size: .75rem; font-weight: 500; }
.hb + .hb { margin-left: 8px; }
.hb.on { color: var(--ac); background: var(--sel); border-color: var(--ac); }
.paper .hintbox { margin-left: 46px; }
.fig { margin: 16px 0 0 46px; }
.fig svg { display: block; max-width: 100%; height: auto; background: #fff; border-radius: 3px; }
canvas { display: block; width: 100%; height: 280px; margin-top: 8px; background: #fff; border: 1px solid var(--bd); border-radius: 4px; touch-action: none; }
.wp { margin: 12px 0 0 46px; padding: 12px; border: 1px solid var(--bd); border-radius: 6px; background: var(--card); }
.wpt { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.wpt button { min-height: 36px; padding: 6px 10px; font-size: .75rem; }
.wpt .wt.on { background: var(--sel); color: var(--ac); border-color: var(--ac); }
.wpc { position: relative; display: inline-block; max-width: 100%; line-height: 0; background: #fff; border: 1px solid var(--bd); border-radius: 3px; }
.wpc > svg { display: block; max-width: 100%; height: auto; }
.wpc > canvas, .wpc > img { position: absolute; inset: 0; width: 100%; height: 100%; }
.wpc > canvas { margin: 0; background: transparent !important; border: 0 !important; border-radius: 0; touch-action: none; cursor: crosshair; }
.wpc.free { display: block; width: 100%; height: 240px; background: repeating-linear-gradient(#fff 0 31px, #e6eaf0 31px 32px); }

/* Drawing tools retain their existing page, zoom, and pen behavior. */
#notes, #paper { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
.nbar, #paper .phead { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--bd); }
#paper .phead b { font-size: 1rem; font-weight: 600; }
#paper .phead button { min-height: 38px; font-size: .8125rem; }
.nbar .tl.on { color: var(--ac); background: var(--sel); border-color: var(--ac); }
#nstage { position: relative; flex: 1; min-height: 0; margin: 12px; overflow: hidden; border: 1px solid var(--bd); border-radius: 4px; background-color: #fff; background-image: linear-gradient(#e6eaf0 1px, transparent 1px), linear-gradient(90deg, #e6eaf0 1px, transparent 1px); background-size: 26px 26px; }
#nstage canvas { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0; background: transparent; }
#paper .pbody { flex: 1; overflow: auto; width: 100%; max-width: 820px; margin: 0 auto; padding: 0 16px 24px; }
#paper canvas { display: block; margin: 0; border: 0; border-radius: 0; background: transparent; }
.zoom { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.zoom span { min-width: 3.6em; color: var(--mut); font-size: .8125rem; text-align: center; font-variant-numeric: tabular-nums; }
.pscroll { flex: 1; overflow: auto; padding: 0 12px 140px; touch-action: none; overscroll-behavior: contain; }
